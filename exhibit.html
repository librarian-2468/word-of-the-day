               border-radius:2px;z-index:-1;transform:rotate(-.6deg)}

        margin-top:8px;font-size:11.5px;line-height:1.4;color:#5a5249}
  .tile.on .cover{border-color:var(--green);transform:translateY(-2px)}

  .detail{grid-column:1/-1;position:relative;background:var(--paper);border:1px solid var(--line);border-radius:16px;

        background:var(--paper);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}

  <template id="t0">
    <div class="dHead">
      <div><h2>언어 공부</h2><div class="author">롬브 커토</div></div>
      <button class="close" type="button" aria-label="닫기">×</button>
    </div>
    <p class="quote">열여섯 언어를 익힌 통역사가 외국어를 배워 온 경험과 공부 방법을 들려줘요. 낯선 언어를 하나씩 알아 가는 일이 새로운 사람과 문화를 만나는 즐거움으로 이어져요.</p>

  <template id="t1">
    <div class="dHead">

      <button class="close" type="button" aria-label="닫기">×</button>
    </div>
    <p class="quote">아기의 첫 낱말부터 오늘날의 문자메시지까지, 말과 글이 어떻게 생겨나고 달라져 왔는지 살펴봐요. 늘 쓰는 언어에도 시대와 사람들의 삶이 겹겹이 쌓여 있음을 발견하게 해요.</p>
    <div class="meta">
      <span class="call">청구기호 <b>701-크298ㅇ</b></span>
      <a class="link" target="_blank" rel="noopener" href="https://www.hscitylib.or.kr/mdlib/program/searchResultList.do?searchType=SIMPLE&searchManageCodeArr=MI&searchKeyword=%EC%96%B8%EC%96%B4%EC%9D%98%20%EC%97%AD%EC%82%AC">대출 가능 여부 확인 →</a>
    </div>
  </template>
  <template id="t2">
    <div class="dHead">
      <div><h2>언어는 어떻게 인간을 바꾸는가</h2><div class="author">비오리카 마리안</div></div>
      <button class="close" type="button" aria-label="닫기">×</button>
    </div>
    <p class="quote">여러 언어를 사용하는 경험이 기억과 감정, 판단과 창의성에 어떤 영향을 주는지 연구와 사례로 풀어내요. 새로운 언어를 배우는 일이 자신과 사회를 바라보는 방식까지 넓힐 수 있음을 보여줘요.</p>
    <div class="meta">

      <a class="link" target="_blank" rel="noopener" href="https://www.hscitylib.or.kr/mdlib/program/searchResultList.do?searchType=SIMPLE&searchManageCodeArr=MI&searchKeyword=%EC%96%B8%EC%96%B4%EB%8A%94%20%EC%96%B4%EB%96%BB%EA%B2%8C%20%EC%9D%B8%EA%B0%84%EC%9D%84%20%EB%B0%94%EA%BE%B8%EB%8A%94%EA%B0%80">대출 가능 여부 확인 →</a>
    </div>

  <template id="t3">
    <div class="dHead">
      <div><h2>언어의 뇌과학</h2><div class="author">알베르트 코스타</div></div>
      <button class="close" type="button" aria-label="닫기">×</button>
    </div>
    <p class="quote">두 언어를 쓰는 사람의 뇌에서 말이 어떻게 처리되는지 아이와 어른을 대상으로 한 연구로 살펴봐요. 언어와 주의력, 감정, 의사결정이 만나는 지점을 따라가며 뇌의 또 다른 가능성을 엿보게 해요.</p>

    <p class="quote">다문화가정에서 자라고 여러 나라에서 배우고 가르친 저자의 경험을 통해 언어가 삶과 맺는 관계를 들려줘요. 서로 다른 말 사이에서 살아가는 이야기가 타인의 세계를 이해하는 시야를 넓혀 줘요.</p>

  <template id="t5">
    <div class="dHead">

    <p class="quote">비트겐슈타인의 사유를 따라가며 평소 고르는 말과 글이 생각과 삶에 어떤 영향을 주는지 돌아봐요. 익숙한 표현을 다시 살피는 일이 자기 세계의 경계를 넓히는 첫걸음이 될 수 있어요.</p>

<script>
  var grid = document.getElementById("grid");
  var COLS = 3;
  function close(){
    var d = document.getElementById("detail"); if (d) d.remove();
    var on = grid.querySelector(".tile.on"); if (on) { on.classList.remove("on"); on.setAttribute("aria-expanded","false"); }
  }
  grid.addEventListener("click", function(e){
    var t = e.target.closest(".tile"); if (!t) return;
    var wasOn = t.classList.contains("on");
    close(); if (wasOn) return;
    var i = +t.dataset.i;
    var d = document.createElement("div"); d.className = "detail"; d.id = "detail";
    d.appendChild(document.getElementById("t" + i).content.cloneNode(true));
    // 누른 표지의 줄 끝 뒤에 끼워 넣기
    var tiles = grid.querySelectorAll(".tile");
    var rowEnd = Math.min(Math.ceil((i + 1) / COLS) * COLS, tiles.length);
    if (rowEnd < tiles.length) grid.insertBefore(d, tiles[rowEnd]); else grid.appendChild(d);
    // 말풍선 꼬리를 누른 표지 가운데로
    var gr = grid.getBoundingClientRect(), tr = t.getBoundingClientRect();
    d.style.setProperty("--x", (tr.left + tr.width/2 - gr.left) + "px");
    t.classList.add("on"); t.setAttribute("aria-expanded","true");
    d.querySelector(".close").addEventListener("click", close);
    setTimeout(function(){ d.scrollIntoView({behavior:"smooth", block:"nearest"}); }, 50);
  });
</script>
